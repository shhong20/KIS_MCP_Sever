name: CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Ensure read-only tool surface
        run: |
          python - <<'PY'
          from pathlib import Path
          source=Path("src/kis_mcp/client.py").read_text()
          assert 'ALLOWED_DATA_PATHS = frozenset({DOMESTIC_BALANCE_PATH})' in source
          assert 'method != "GET"' in source
          assert 'order-cash' not in source
          print("Read-only API allowlist PASS")
          PY
